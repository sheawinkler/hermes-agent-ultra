name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Fetch upstream parity reference
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch --no-tags upstream main
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Generate parity governance artifacts
        run: |
          python3 scripts/generate-parity-matrix.py --local-ref HEAD
          python3 scripts/generate-workstream-status.py
          python3 scripts/generate-test-intent-mapping.py
          python3 scripts/generate-test-coverage-audit.py --check
          python3 scripts/generate-adapter-matrix.py
          python3 scripts/validate-intentional-divergence.py --check --allow-warnings
          python3 scripts/generate-shared-diff-backlog.py --local-ref HEAD --no-fetch
          python3 scripts/generate-upstream-patch-queue.py \
            --local-ref HEAD \
            --fork-url "$(git remote get-url origin)" \
            --fork-branch "${{ github.head_ref || github.ref_name }}" \
            --max-commits 0
          python3 scripts/generate-upstream-workstreams.py --check
          python3 scripts/generate-global-parity-proof.py
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy Warning Gate
        run: bash scripts/clippy-warning-gate.sh --check
      - name: Rust module size policy
        run: cargo test -p hermes-source-parity-tests --test rust_module_size_policy -- --nocapture
      - name: Placeholder gate
        run: bash scripts/check-runtime-placeholders.sh
      - name: Tests
        run: cargo test --workspace
      - name: Parity fixture tests
        run: cargo test -p hermes-parity-tests
      - name: CLI command/action parity contract
        run: cargo test -p hermes-source-parity-tests --test cli_command_contract
      - name: Protocol differential parity contract
        run: cargo test -p hermes-protocol-parity-tests --test protocol_differential_contracts
      - name: Upstream slash-command parity gate
        run: python3 scripts/run-upstream-slash-parity-gate.py --upstream-ref upstream/main
      - name: Upstream surface coverage gate
        run: python3 scripts/run-upstream-surface-coverage-gate.py --repo-root . --upstream-ref upstream/main --local-ref HEAD
      - name: Global parity governance contract
        run: cargo test -p hermes-source-parity-tests --test global_parity_governance
      - name: Upstream webhook sync script lint
        run: |
          python3 -m py_compile scripts/upstream_webhook_sync.py
          python3 -m py_compile scripts/publish_automation_summary.py
          python3 -m py_compile scripts/run-golden-parity-harness.py
          python3 -m py_compile scripts/run-upstream-slash-parity-gate.py
          python3 -m py_compile scripts/run-upstream-surface-coverage-gate.py
          python3 -m py_compile scripts/generate-shared-diff-backlog.py
          python3 -m py_compile scripts/generate-test-coverage-audit.py
          python3 -m py_compile scripts/generate-release-readiness-summary.py
          python3 -m py_compile scripts/generate-upstream-workstreams.py
          python3 -m py_compile scripts/release_secret_scan.py

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Cross build hermes
        run: cross build --release --target ${{ matrix.target }} -p hermes-cli

  macos-build:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build hermes
        run: cargo build --release --target ${{ matrix.target }} -p hermes-cli

  windows-installer-contract:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse release installer and enforce Windows-safe encoding
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "scripts/install.ps1"
          $raw = [System.IO.File]::ReadAllBytes($installer)
          if ($raw | Where-Object { $_ -ge 0x80 }) {
            throw "scripts/install.ps1 must remain ASCII for Windows PowerShell 5.1."
          }

          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $installer,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            throw "scripts/install.ps1 has parse errors: $($parseErrors -join '; ')"
          }

          $source = [System.Text.Encoding]::ASCII.GetString($raw)
          foreach ($required in @(
            "function Get-TargetAsset",
            "function Get-ReleaseUrl",
            "function Install-HermesRelease",
            "hermes-windows-x86_64.zip",
            "Expand-Archive",
            "Legacy hermes alias not installed by default"
          )) {
            if (-not $source.Contains($required)) {
              throw "scripts/install.ps1 is missing required release contract: $required"
            }
          }
