[package]
name = "hermes-config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Configuration management for Hermes Agent"

[dependencies]
hermes-core = { workspace = true }
hermes-skills = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
directories = { workspace = true }
url = { workspace = true }
indexmap = { workspace = true }
chrono = { workspace = true }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

[features]
default = []
# Exposes `managed_gateway::test_lock` so downstream crates' tests can
# serialise on the same global env-var lock and avoid races.
test-helpers = []

[dev-dependencies]
parking_lot = { workspace = true }
