[package]
name = "hermes-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tool registry, toolsets, and tool implementations for Hermes Agent"

[dependencies]
hermes-core = { workspace = true }
hermes-environments = { workspace = true }

hermes-config = { workspace = true }
hermes-intelligence = { workspace = true }
hermes-skills = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "multipart", "stream"] }
rusqlite = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
indexmap = { workspace = true }
parking_lot = { workspace = true }
fs2 = "0.4"
thiserror = { workspace = true }
base64 = { workspace = true }
serde_yaml = { workspace = true }
url = { workspace = true }
rand = "0.10.1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_IO",
] }

[dev-dependencies]
hermes-config = { workspace = true, features = ["test-helpers"] }
hermes-environments = { workspace = true, features = ["docker"] }
wiremock = "0.6"
