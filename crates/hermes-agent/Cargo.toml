[package]
name = "hermes-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent loop engine for Hermes Agent"

[dependencies]
hermes-core = { workspace = true }
hermes-auth = { workspace = true }
hermes-tools = { workspace = true }
hermes-intelligence = { workspace = true }
hermes-skills = { workspace = true }
hermes-environments = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json", "multipart"] }
which = "7"
eventsource-stream = { workspace = true }
tokio-stream = { workspace = true }
async-stream = "0.3"
lazy_static = "1"
dirs = "6"
rusqlite = { workspace = true }
serde_yaml = { workspace = true }
shlex = "1.3.0"
uuid = { workspace = true, features = ["v4"] }
syn = { version = "2", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
aes-gcm = { workspace = true }
ed25519-dalek = "2"
rand = { workspace = true }
zeroize = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
parking_lot = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
hermes-config = { workspace = true }
tempfile = "3"
